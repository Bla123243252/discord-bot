<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>LS Anticheat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="hidden">
    <div class="sidebar">
        <div class="brand">LS <span>ANTICHEAT</span></div>
        <nav>
            <button class="nav-item active" data-tab="dashboard">Dashboard</button>
            <button class="nav-item" data-tab="players">Spieler</button>
            <button class="nav-item" data-tab="flags">Flags</button>
            <button class="nav-item" data-tab="bans">Bans</button>
            <button class="nav-item" data-tab="whitelist">Whitelist</button>
        </nav>
        <button id="closeBtn" class="close-btn">Schließen (ESC)</button>
    </div>

    <div class="main">
        <div id="tab-dashboard" class="tab active">
            <h1>Dashboard</h1>
            <div class="stat-grid">
                <div class="stat-card">
                    <div class="stat-label">Online Spieler</div>
                    <div class="stat-value" id="statPlayers">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Offene Flags</div>
                    <div class="stat-value" id="statFlags">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Aktive Bans</div>
                    <div class="stat-value" id="statBans">-</div>
                </div>
            </div>
        </div>

        <div id="tab-players" class="tab">
            <h1>Spieler</h1>
            <div id="playerGrid" class="grid"></div>
        </div>

        <div id="tab-flags" class="tab">
            <h1>Flags</h1>
            <div id="flagList" class="list"></div>
        </div>

        <div id="tab-bans" class="tab">
            <h1>Bans</h1>
            <div id="banList" class="grid"></div>
        </div>

        <div id="tab-whitelist" class="tab">
            <h1>Whitelist</h1>
            <div id="whitelistList" class="list"></div>
        </div>
    </div>
</div>

<div id="modalOverlay" class="modal-overlay hidden">
    <div id="modalBox" class="modal-box"></div>
</div>

<script src="app.js"></script>
</body>
</html>
